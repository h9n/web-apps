<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scratch">
  <meta name="description" content="A private, local-only plain-text scratchpad.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <title>Scratch</title>
</head>
<body>
  <main id="app">
    <section id="list-view" class="view" aria-labelledby="app-title">
      <header class="topbar">
        <h1 id="app-title">Scratch</h1>
        <div class="topbar-actions">
          <button id="settings-button" type="button" hidden aria-hidden="true" tabindex="-1">Aa</button>
          <button id="new-note-button" class="icon-button primary" type="button" aria-label="New note">＋</button>
        </div>
      </header>

      <div id="empty-state" class="empty-state" hidden>
        <p>Nothing here.</p>
        <button id="empty-new-button" type="button">Make a note</button>
      </div>
      <ol id="notes-list" class="notes-list" aria-label="Notes, most recently edited first"></ol>
    </section>

    <section id="editor-view" class="view editor-view" aria-label="Note editor" hidden>
      <header class="topbar editor-bar">
        <button id="back-button" class="text-button" type="button">‹ Notes</button>
        <span id="save-status" class="save-status" role="status">Saved</span>
        <div class="editor-actions">
          <button id="editor-settings-button" class="text-button" type="button" aria-label="Typography and data settings">Aa</button>
          <button id="delete-button" class="text-button danger" type="button">Delete</button>
        </div>
      </header>
      <textarea id="editor" aria-label="Note text" autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="true" placeholder="Start typing…"></textarea>
    </section>
  </main>

  <dialog id="settings-dialog">
    <form method="dialog" class="settings-sheet">
      <header class="sheet-header">
        <h2>Display</h2>
        <button class="text-button" value="close" aria-label="Close settings">Done</button>
      </header>

      <div class="setting-row">
        <span>Text size</span>
        <div class="segmented" role="group" aria-label="Text size">
          <button type="button" data-setting="size" data-value="small">Small</button>
          <button type="button" data-setting="size" data-value="large">Big</button>
        </div>
      </div>
      <div class="setting-row">
        <span>Typeface</span>
        <div class="segmented" role="group" aria-label="Typeface">
          <button type="button" data-setting="font" data-value="sans">Sans</button>
          <button type="button" data-setting="font" data-value="mono">Mono</button>
        </div>
      </div>
      <div class="setting-row">
        <span>Soft wrap</span>
        <label class="switch">
          <input id="wrap-toggle" type="checkbox">
          <span aria-hidden="true"></span>
        </label>
      </div>

      <section class="data-section" aria-labelledby="data-heading">
        <h3 id="data-heading">Local data</h3>
        <p id="storage-status">Checking storage…</p>
        <button id="export-button" class="wide-button" type="button">Export backup</button>
        <button id="import-button" class="wide-button" type="button">Import backup</button>
        <input id="import-input" type="file" accept="application/json,.json" hidden>
      </section>
    </form>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
